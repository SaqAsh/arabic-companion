[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arabic-companion"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["openai>=2,<3", "audioop-lts; python_version >= '3.13'", "PySide6>=6.6,<7", "PyAudioWPatch>=0.2.12.6; sys_platform == 'win32'"]

[project.scripts]
arabic-companion = "arabic_companion.app:main"
arabic-audio = "arabic_companion.capture:main"
